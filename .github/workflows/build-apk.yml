name: Build APK
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Build Release APK (debug-signed when no keystore)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Rename artifacts
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          cd out && for f in *.apk; do
            ts=$(date +%Y%m%d%H%M)
            mv "$f" "MotoDash-${ts}-${f}"
          done
          ls -lh
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MotoDash-APK
          path: out/*.apk
          retention-days: 30
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: MotoDash Build ${{ github.run_number }}
          body: |
            自动构建的 MotoDash 车机录像 APK。
            - 提交：${{ github.sha }}
            - 构建时间：${{ github.event.repository.updated_at }}
          files: out/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}